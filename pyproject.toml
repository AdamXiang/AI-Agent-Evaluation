[project]
name = "agent-evaluation"
version = "0.1.0"
description = "End-to-end evaluation of a tool-using LangChain refund agent with DeepEval: answer, tool-call and trace-level metrics."
readme = "README.md"
authors = [
    { name = "Adam", email = "lavouver96@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "deepeval>=4.3.2",
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
]

[project.scripts]
agent-evaluation = "agent_evaluation:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
